<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle glow behind hammer & ledger -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Ledger Book Icon Graphic -->
  <g filter="url(#dropShadow)">
    <!-- Book Back -->
    <rect x="120" y="110" width="272" height="300" rx="18" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <!-- Ruled paper inside book -->
    <rect x="140" y="130" width="232" height="260" rx="10" fill="#fef3c7"/>
    <!-- Diary red margin line -->
    <line x1="185" y1="130" x2="185" y2="390" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <!-- Ruled blue lines -->
    <line x1="140" y1="175" x2="372" y2="175" stroke="#93c5fd" stroke-width="2"/>
    <line x1="140" y1="215" x2="372" y2="215" stroke="#93c5fd" stroke-width="2"/>
    <line x1="140" y1="255" x2="372" y2="255" stroke="#93c5fd" stroke-width="2"/>
    <line x1="140" y1="295" x2="372" y2="295" stroke="#93c5fd" stroke-width="2"/>
    <line x1="140" y1="335" x2="372" y2="335" stroke="#93c5fd" stroke-width="2"/>
    <line x1="140" y1="370" x2="372" y2="370" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <!-- Construction Hammer Graphic crossing over -->
  <g filter="url(#dropShadow)" transform="rotate(35 256 256)">
    <!-- Handle -->
    <rect x="242" y="100" width="28" height="240" rx="8" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <rect x="242" y="260" width="28" height="70" rx="6" fill="#1e293b"/>
    <!-- Golden Hammer Head -->
    <path d="M190,100 L322,100 Q330,100 330,110 L330,140 Q330,150 322,150 L190,150 Q180,150 180,140 L180,110 Q180,100 190,100 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="4"/>
    <rect x="330" y="112" width="24" height="26" rx="4" fill="#fbbf24"/>
    <path d="M180,112 L140,125 L180,138 Z" fill="#d97706"/>
  </g>

  <!-- Site Badge at bottom -->
  <g transform="translate(156, 424)">
    <rect width="200" height="42" rx="21" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
    <text x="100" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">साइट डायरी</text>
  </g>
</svg>
