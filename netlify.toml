[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# No redirect for /mcp. The function declares its own paths (see the `config`
# export in netlify/functions/mcp.js), and a forced redirect to the old
# /.netlify/functions/ address sent every request to a route that no longer
# exists once a v2 function claims a path of its own — which then fell
# through to the SPA catch-all and answered MCP calls with index.html.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
